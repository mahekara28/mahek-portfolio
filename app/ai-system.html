<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Is Not The System — Interactive Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,560;1,9..144,450&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:       #050705;
    --bg-2:     #070a08;
    --ink:      #f2f1ea;
    --ink-dim:  #8b9490;
    --accent:   #6dffab;
    --accent-dim: #1f5c3d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
  }

  #stageWrap{
    position:relative;
    width:min(100vw, 56.25vh);
    height:min(177.78vw, 100vh);
    background:radial-gradient(120% 90% at 50% 20%, var(--bg-2) 0%, var(--bg) 60%, #020302 100%);
    overflow:hidden;
    box-shadow:0 0 80px rgba(0,0,0,0.9);
  }

  canvas#particles{ position:absolute; inset:0; width:100%; height:100%; opacity:0.5; }

  #loopSvg{ position:absolute; inset:0; width:100%; height:100%; }

  .node rect{
    fill:rgba(9,14,11,0.85);
    stroke:var(--accent);
    stroke-width:1.4;
    filter:drop-shadow(0 0 14px rgba(109,255,171,0.35));
    cursor: pointer;
    transition: transform 0.2s ease, fill 0.2s ease, stroke-width 0.2s ease;
  }
  .node:hover rect{
    fill: rgba(31, 92, 61, 0.6);
    stroke-width: 2.5;
    filter:drop-shadow(0 0 22px rgba(109,255,171,0.8));
  }
  .node.center rect{
    stroke-width:2;
    filter:drop-shadow(0 0 26px rgba(109,255,171,0.55));
  }
  .node text{
    fill:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    font-weight:500;
    letter-spacing:0.12em;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events: none;
  }
  .node.center text{ font-size:28px; }
  .node{ opacity:0; }

  .spoke{
    stroke:var(--accent-dim);
    stroke-width:1.4;
    opacity:0;
    transition: stroke 0.3s ease;
  }
  .spoke.lit{ stroke:var(--accent); }

  #boundary{
    fill:rgba(109,255,171,0.05);
    stroke:var(--accent);
    stroke-width:1.6;
    stroke-dasharray:6 8;
    opacity:0;
  }

  #network{ transition:opacity 900ms ease; }

  .arc{ fill:none; stroke:var(--accent-dim); stroke-width:2; }
  .arc.lit{ stroke:var(--accent); }

  #loopDiagram{ opacity:0; }

  #travelDot{ opacity:0; }

  #credit{
    position:absolute; bottom:6%; left:50%; transform:translateX(-50%);
    font-size:13px; letter-spacing:0.18em; color:var(--ink-dim);
    opacity:0; text-transform:uppercase;
  }

  #caption{
    position:absolute; bottom:14%; left:50%; transform:translateX(-50%);
    font-size:15px; color:var(--ink); letter-spacing:0.02em;
    opacity:0; width:82%; text-align:center;
    font-family:'JetBrains Mono', monospace;
    transition:opacity 0.3s ease;
    background: rgba(5, 7, 5, 0.7);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(109,255,171,0.2);
  }

  /* Deep Dive Modal Panel */
  #deepDiveCard {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 85%;
    background: rgba(7, 10, 8, 0.95);
    border: 1.5px solid var(--accent);
    box-shadow: 0 0 35px rgba(109, 255, 171, 0.3);
    border-radius: 12px;
    padding: 24px;
    color: var(--ink);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
  }
  #deepDiveCard.active {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  #deepDiveTitle {
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #deepDiveBody {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }
  #deepDiveClose {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 14px;
    border-radius: 16px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    float: right;
  }

  /* Controls Bar */
  #controls{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:#8b9490; z-index:10;
    background: rgba(0,0,0,0.8);
    padding: 6px 12px;
    border-radius: 30px;
    border: 1px solid #222;
  }
  #controls button, #controls label{
    background:#111; border:1px solid #2a2a2a; color:#eee;
    padding:8px 14px; border-radius:20px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    user-select: none;
  }
  #controls button:hover{ border-color:#6dffab; color:#6dffab; }
  #progressTrack{ width:120px; height:4px; background:#222; border-radius:2px; overflow:hidden; cursor:pointer; }
  #progressBar{ height:100%; width:0%; background:#6dffab; }
</style>
</head>
<body>

<div id="stageWrap">
  <canvas id="particles"></canvas>

  <svg id="loopSvg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#6dffab"></path>
      </marker>
    </defs>

    <!-- NETWORK PHASE -->
    <g id="network">
      <polygon id="boundary" points="540,520 901,783 763,1207 317,1207 179,783"></polygon>

      <line class="spoke" id="spoke-context"   x1="540" y1="900" x2="540" y2="520"></line>
      <line class="spoke" id="spoke-memory"    x1="540" y1="900" x2="901" y2="783"></line>
      <line class="spoke" id="spoke-tools"     x1="540" y1="900" x2="763" y2="1207"></line>
      <line class="spoke" id="spoke-retrieval" x1="540" y1="900" x2="317" y2="1207"></line>
      <line class="spoke" id="spoke-state"     x1="540" y1="900" x2="179" y2="783"></line>

      <g class="node center" id="node-model" data-key="model">
        <rect x="420" y="858" width="240" height="84" rx="42"></rect>
        <text x="540" y="900">MODEL</text>
      </g>
      <g class="node" id="node-context" data-key="context">
        <rect x="420" y="486" width="240" height="64" rx="32"></rect>
        <text x="540" y="518">CONTEXT</text>
      </g>
      <g class="node" id="node-memory" data-key="memory">
        <rect x="781" y="750" width="240" height="64" rx="32"></rect>
        <text x="901" y="782">MEMORY</text>
      </g>
      <g class="node" id="node-tools" data-key="tools">
        <rect x="643" y="1174" width="240" height="64" rx="32"></rect>
        <text x="763" y="1206">TOOLS</text>
      </g>
      <g class="node" id="node-retrieval" data-key="retrieval">
        <rect x="177" y="1174" width="280" height="64" rx="32"></rect>
        <text x="317" y="1206">RETRIEVAL</text>
      </g>
      <g class="node" id="node-state" data-key="state">
        <rect x="59" y="750" width="240" height="64" rx="32"></rect>
        <text x="179" y="782">STATE</text>
      </g>
    </g>

    <!-- LOOP PHASE -->
    <g id="loopDiagram">
      <path id="arcA" class="arc" marker-end="url(#arrow)" d="M 540 600 A 300 300 0 0 1 799.8 1050"></path>
      <path id="arcB" class="arc" marker-end="url(#arrow)" d="M 799.8 1050 A 300 300 0 0 1 280.2 1050"></path>
      <path id="arcC" class="arc" marker-end="url(#arrow)" d="M 280.2 1050 A 300 300 0 0 1 540 600"></path>

      <path id="fullLoop" style="display:none"
        d="M 540 600 A 300 300 0 0 1 799.8 1050 A 300 300 0 0 1 280.2 1050 A 300 300 0 0 1 540 600"></path>

      <g class="node" id="node-observe" data-key="observe">
        <rect x="420" y="562" width="240" height="66" rx="33"></rect>
        <text x="540" y="596">OBSERVE</text>
      </g>
      <g class="node" id="node-decide" data-key="decide">
        <rect x="679" y="1017" width="230" height="66" rx="33"></rect>
        <text x="799" y="1051">DECIDE</text>
      </g>
      <g class="node" id="node-act" data-key="act">
        <rect x="180" y="1017" width="200" height="66" rx="33"></rect>
        <text x="280" y="1051">ACT</text>
      </g>

      <circle id="travelDot" r="9" fill="#e8fff2">
        <animateMotion id="dotMotion" dur="2.4s" repeatCount="indefinite" rotate="auto">
          <mpath href="#fullLoop"></mpath>
        </animateMotion>
      </circle>
    </g>
  </svg>

  <!-- DEEP DIVE OVERLAY CARD -->
  <div id="deepDiveCard">
    <div id="deepDiveTitle">Component Title</div>
    <div id="deepDiveBody">Detailed architectural description goes here.</div>
    <button id="deepDiveClose">Resume Animation</button>
  </div>

  <div id="caption"></div>
  <div id="credit">MAHEK ARA &middot; AI ENGINEER</div>
</div>

<div id="controls">
  <button id="playBtn">▶ Play</button>
  <button id="restartBtn">↺ Restart</button>
  <label><input type="checkbox" id="voiceToggle" checked> Voiceover</label>
  <div id="progressTrack"><div id="progressBar"></div></div>
</div>

<script>
/* Deep Dive Knowledge Base */
const DEEP_DIVE_DATA = {
  model: {
    title: "The Model Engine",
    body: "The Large Language Model (LLM) is purely a pattern engine. It computes probability distributions over tokens but holds no real-time state, internal persistent memory, or direct execution capabilities."
  },
  context: {
    title: "Context Window",
    body: "The working memory buffer. Defines the active scope, system instructions, and user instructions available during a single generation step."
  },
  memory: {
    title: "Persistent Memory",
    body: "Stores long-term conversation history, user preferences, and entity knowledge across multiple sessions."
  },
  tools: {
    title: "Tool Integration",
    body: "Enables the system to act upon the external world—executing code, invoking APIs, writing to databases, or calling local functions."
  },
  retrieval: {
    title: "RAG & Vector Retrieval",
    body: "Dynamically fetches ground-truth knowledge from external document indices or databases to augment prompt accuracy."
  },
  state: {
    title: "State Management",
    body: "Tracks application state, workflow flags, multi-turn dialogue stacks, and execution control flow across agent calls."
  },
  observe: {
    title: "Observe Stage",
    body: "Gathers system inputs, user requests, tool responses, and vector search results into a unified snapshot."
  },
  decide: {
    title: "Decide Stage",
    body: "Evaluates available data against system goals to choose the next optimal action or generation step."
  },
  act: {
    title: "Act Stage",
    body: "Executes the chosen action—invoking external API calls, updating internal state, or outputting user responses."
  }
};

const T = {
  modelIn:        300,
  cap1:           [300, 3000, "We keep calling the model the intelligence."],

  satStart:       3000,
  satStagger:     550,
  cap2:           [3000, 7000, "But a model by itself doesn't know what to remember, what to retrieve, or what to do."],

  ringDraw:       7200,
  ringFill:       8200,
  cap3:           [7000, 11000, "Those decisions come from the system around it."],

  networkOut:     11000,
  loopIn:         11800,
  arcsDraw:       12400,
  dotStart:       13800,
  cap4:           [11000, 17500, "That's where intelligence starts to emerge."],

  creditIn:       16800,
  end:            18500
};

const el = id => document.getElementById(id);
const satellites = ['context','memory','tools','retrieval','state'];

const stageEls = {
  caption: el('caption'),
  credit: el('credit'),
  network: el('network'),
  boundary: el('boundary'),
  model: el('node-model'),
  spokes: satellites.map(s => el('spoke-'+s)),
  satNodes: satellites.map(s => el('node-'+s)),
  loopDiagram: el('loopDiagram'),
  loopArcs: ['arcA','arcB','arcC'].map(el),
  loopNodes: [el('node-observe'), el('node-decide'), el('node-act')],
  dot: el('travelDot')
};

let isPaused = false;
let voiceEnabled = true;
let synth = window.speechSynthesis;
let currentUtterance = null;
let timers = [];
let animStartTime = 0;
let pausedTimeAcc = 0;
let pauseStart = 0;

el('voiceToggle').addEventListener('change', e => {
  voiceEnabled = e.target.checked;
  if(!voiceEnabled && synth) synth.cancel();
});

function speakText(text) {
  if (!voiceEnabled || !synth) return;
  synth.cancel();
  
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.95;
  utt.pitch = 1.1; // Slightly higher pitch for a more natural female tone

  // Fetch available voices on the user's browser/system
  const voices = synth.getVoices();
  
  // Look for common high-quality female voices across OS platforms
  const femaleVoice = voices.find(v => 
    v.lang.startsWith('en') && (
      v.name.includes('Samantha') ||   // macOS / iOS
      v.name.includes('Zira') ||       // Windows
      v.name.includes('Jenny') ||      // Windows / Edge
      v.name.includes('Google US English') || // Chrome
      v.name.toLowerCase().includes('female')
    )
  );

  if (femaleVoice) {
    utt.voice = femaleVoice;
  }

  currentUtterance = utt;
  synth.speak(utt);
}

// Ensure voices are loaded asynchronously if required by Chrome/Edge
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = () => synth.getVoices();
}

function fadeIn(node, dur=600){
  node.style.transition = `opacity ${dur}ms ease`;
  requestAnimationFrame(()=> node.style.opacity = 1);
}
function fadeOut(node, dur=600){
  node.style.transition = `opacity ${dur}ms ease`;
  node.style.opacity = 0;
}
function drawArc(path, dur=900){
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.style.transition = `stroke-dashoffset ${dur}ms ease, stroke 300ms ease`;
  requestAnimationFrame(()=>{
    path.style.strokeDashoffset = 0;
    path.classList.add('lit');
  });
}

function schedule(fn, t){ timers.push(setTimeout(fn, t)); }
function clearAll(){ timers.forEach(clearTimeout); timers = []; if(synth) synth.cancel(); }

function resetStage(){
  clearAll();
  isPaused = false;
  pausedTimeAcc = 0;
  el('playBtn').textContent = '❚❚ Pause';
  [stageEls.caption, stageEls.credit, stageEls.model, stageEls.boundary, stageEls.dot]
    .forEach(n => { n.style.transition='none'; n.style.opacity = 0; });
  stageEls.satNodes.forEach(n => { n.style.transition='none'; n.style.opacity = 0; });
  stageEls.spokes.forEach(s => { s.style.transition='none'; s.style.opacity = 0; s.classList.remove('lit'); });
  stageEls.loopNodes.forEach(n => { n.style.transition='none'; n.style.opacity = 0; });
  stageEls.loopArcs.forEach(p => {
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.classList.remove('lit');
  });
  stageEls.network.style.transition = 'none';
  stageEls.network.style.opacity = 1;
  stageEls.loopDiagram.style.transition = 'none';
  stageEls.loopDiagram.style.opacity = 0;
  const dm = document.getElementById('dotMotion');
  if(dm.beginElement) dm.beginElement();
  el('progressBar').style.width = '0%';
}

function showCaption([start,end,text]){
  schedule(()=>{ 
    stageEls.caption.textContent = text; 
    fadeIn(stageEls.caption,300); 
    speakText(text);
  }, start);
  schedule(()=>{ fadeOut(stageEls.caption,300); }, end - 200);
}

function playTimeline(){
  resetStage();
  animStartTime = performance.now();

  schedule(()=> fadeIn(stageEls.model, 700), T.modelIn);
  showCaption(T.cap1);

  satellites.forEach((s, i) => {
    const t = T.satStart + i * T.satStagger;
    schedule(()=>{
      fadeIn(stageEls.spokes[i], 400);
      stageEls.spokes[i].classList.add('lit');
      fadeIn(stageEls.satNodes[i], 500);
    }, t);
  });
  showCaption(T.cap2);

  schedule(()=> fadeIn(stageEls.boundary, 900), T.ringDraw);
  schedule(()=>{ stageEls.boundary.style.transition = 'opacity 900ms ease'; stageEls.boundary.style.opacity = 1; }, T.ringFill);
  showCaption(T.cap3);

  schedule(()=> fadeOut(stageEls.network, 800), T.networkOut);

  schedule(()=> fadeIn(stageEls.loopDiagram, 700), T.loopIn);
  schedule(()=> stageEls.loopNodes.forEach(n => fadeIn(n, 500)), T.loopIn + 100);
  stageEls.loopArcs.forEach((p, i) => {
    schedule(()=> drawArc(p, 700), T.arcsDraw + i * 500);
  });
  showCaption(T.cap4);

  schedule(()=>{
    fadeIn(stageEls.dot, 400);
    const dm = document.getElementById('dotMotion');
    if(dm.beginElement) dm.beginElement();
  }, T.dotStart);

  schedule(()=> fadeIn(stageEls.credit, 900), T.creditIn);

  function tick(){
    if(!isPaused){
      const elapsed = performance.now() - animStartTime - pausedTimeAcc;
      const pct = Math.min(100, (elapsed / T.end) * 100);
      el('progressBar').style.width = pct + '%';
      if(elapsed >= T.end) el('playBtn').textContent = '▶ Play';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function pauseTimeline(){
  if(isPaused) return;
  isPaused = true;
  pauseStart = performance.now();
  if(synth) synth.pause();
  el('playBtn').textContent = '▶ Resume';
}

function resumeTimeline(){
  if(!isPaused) return;
  isPaused = false;
  pausedTimeAcc += (performance.now() - pauseStart);
  if(synth) synth.resume();
  el('playBtn').textContent = '❚❚ Pause';
}

/* Deep-Dive Interaction Logic */
document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('click', (e) => {
    const key = node.getAttribute('data-key');
    const info = DEEP_DIVE_DATA[key];
    if(info){
      pauseTimeline();
      el('deepDiveTitle').textContent = info.title;
      el('deepDiveBody').textContent = info.body;
      el('deepDiveCard').classList.add('active');
    }
  });
});

el('deepDiveClose').addEventListener('click', () => {
  el('deepDiveCard').classList.remove('active');
  resumeTimeline();
});

el('playBtn').addEventListener('click', () => {
  if(isPaused) resumeTimeline();
  else pauseTimeline();
});

el('restartBtn').addEventListener('click', playTimeline);

/* Ambient Particles */
const canvas = el('particles');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const wrap = el('stageWrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = Array.from({length: 36}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random()*1.6 + 0.4,
  vy: (Math.random()*0.02 + 0.006) / 100,
  vx: (Math.random()-0.5) * 0.006 / 100,
  a: Math.random()*0.5 + 0.15
}));

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.y -= p.vy; p.x += p.vx;
    if(p.y < -0.02) p.y = 1.02;
    if(p.x < -0.02) p.x = -0.02;
    if(p.x > 1.02) p.x = -0.02;
    const px = p.x*canvas.width, py = p.y*canvas.height;
    ctx.beginPath();
    ctx.fillStyle = `rgba(109,255,171,${p.a})`;
    ctx.arc(px, py, p.r*2, 0, Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

setTimeout(playTimeline, 400);
</script>
</body>
</html>
